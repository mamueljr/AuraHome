        Splash crítico: se ve mientras carga el bundle de React. En cuanto

        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        background: oklch(0.982 0.005 295);
      }

        height: 64px;
        border-radius: 20px;

        font-family: system-ui, sans-serif;
        font-size: 1.05rem;
        font-weight: 600;
        color: oklch(0.22 0.02 295);
        text-align: center;
      }

        #root {
